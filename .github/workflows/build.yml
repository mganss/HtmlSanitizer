name: Build

on:
  push:
    branches: [ '**' ]
  pull_request:

env:
  CI_BUILD_VERSION: 10.1.${{ github.run_number }}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 8.0.x

      - name: Setup Java (for SonarScanner)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore
        run: dotnet restore

      - name: Pack
        run: dotnet pack --include-symbols --include-source -c Release src/HtmlSanitizer -o packages

      - name: Install SonarScanner
        if: github.event_name != 'pull_request'
        run: dotnet tool install --global dotnet-sonarscanner

      - name: SonarScanner begin
        if: github.event_name != 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          dotnet sonarscanner begin
          /k:"mganss_HtmlSanitizer"
          /v:"${{ env.CI_BUILD_VERSION }}"
          /o:"mganss-github"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="$SONAR_TOKEN"
          /d:sonar.cs.opencover.reportsPaths="${{ github.workspace }}/coverage.xml"
          /d:sonar.coverage.exclusions="**/Program.cs"
          /d:sonar.exclusions="**/*.html"

      - name: Build
        if: github.event_name != 'pull_request'
        run: dotnet build

      - name: Test
        run: dotnet test test/HtmlSanitizer.Tests/HtmlSanitizer.Tests.csproj -f net8.0 --coverlet --coverlet-output-format opencover --results-directory .

      - name: Rename coverage report
        run: cp coverage.*.xml ./coverage.xml

      - name: SonarScanner end
        if: github.event_name != 'pull_request'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: packages
          path: packages/*.*nupkg

      - name: Create release
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ env.CI_BUILD_VERSION }}
          name: ${{ env.CI_BUILD_VERSION }}
          body: ${{ github.event.head_commit.message }}
          draft: true
          files: packages/*.*nupkg
